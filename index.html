<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Hua — Geometry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="banner">
  <div class="inner"><h1>Mr. Hua's Geometry Demo</h1></div>
</div>

<main><div class="grid" id="grid"></div></main>

<script>
/* =====================================================================
   EDIT THIS LIST.
   "text" is what the card says. "link" is the page it opens.
   ===================================================================== */
const UNITS = [
  { text:"Unit 1 Constructions and Transformations", link:"units/unit1.html" },
  { text:"Unit 2 Congruence",                        link:"units/unit2.html" },
  { text:"Unit 3 Similarity",                        link:"units/unit3.html" },
  { text:"Unit 4 Right Triangle Trigonometry",       link:"units/unit4.html" },
  { text:"Unit 5 Solid Geometry",                    link:"units/unit5.html" },
  { text:"Unit 6 Coordinate Geometry",               link:"units/unit6.html" },
  { text:"Unit 7 Circles",                           link:"units/unit7.html" },
  { text:"Unit 8 Conditional Probability",           link:"units/unit8.html" }
];
/* ===================================================================== */

const grid = document.getElementById("grid");
UNITS.forEach(u => {
  const card = document.createElement("a");
  card.className = "card";
  card.href = u.link;
  card.textContent = u.text;
  grid.appendChild(card);
});
</script>
</body>
</html>
